name: opencode

# Build (opens or updates a PR): /oc, /opencode
# Investigation (github-reply): /oci, /oca, /oc-issue, /oc-ask, /opencode-issue, /opencode-ask
#
# Secrets: OPENCODE_API_KEY, OPENCODE_GO_API_KEY
# Variable: OPENCODE_TRIGGER_ALLOWLIST (comma-separated extra trigger logins)

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, edited]
  pull_request:
    types: [opened, edited]

jobs:
  opencode:
    permissions:
      id-token: write
    uses: hskksk/gh-actions/.github/workflows/opencode.yml@v1
    secrets: inherit
    with:
      toolchain: pnpm
      trigger-allowlist: ${{ vars.OPENCODE_TRIGGER_ALLOWLIST }}
